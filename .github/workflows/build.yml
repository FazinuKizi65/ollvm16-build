name: build-ollvm16
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git

      - name: clone llvm
        run: |
          git clone --depth 1 -b release/16.x https://github.com/llvm/llvm-project.git /tmp/llvm-project

      - name: clone ollvm16
        run: |
          git clone --depth 1 https://github.com/wwh1004/ollvm-16.git /tmp/ollvm-16

      - name: integrate obfuscation
        run: |
          cp -r /tmp/ollvm-16/Obfuscation /tmp/llvm-project/llvm/lib/Obfuscation
          python3 - <<'PY'
          p='/tmp/llvm-project/llvm/lib/CMakeLists.txt'
          s=open(p).read()
          if 'add_subdirectory(Obfuscation)' not in s:
              s=s.replace('add_subdirectory(WindowsManifest)', 'add_subdirectory(WindowsManifest)\nadd_subdirectory(Obfuscation)')
              open(p,'w').write(s)
          PY

      - name: configure
        run: |
          cmake -S /tmp/llvm-project/llvm -B /tmp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/install

      - name: build
        run: |
          ninja -C /tmp/build -j2 clang lld llvm-ar llvm-nm llvm-objcopy llvm-strip Obfuscation

      - name: package
        run: |
          mkdir -p /tmp/out/ollvm/bin /tmp/out/ollvm/lib
          cp /tmp/build/bin/clang-16 /tmp/out/ollvm/bin/clang-16 2>/dev/null || cp /tmp/build/bin/clang /tmp/out/ollvm/bin/clang-16
          ln -sf clang-16 /tmp/out/ollvm/bin/clang
          ln -sf clang-16 /tmp/out/ollvm/bin/clang++
          # plugin
          find /tmp/build -name '*Obfuscation*' -not -path '*/CMakeFiles/*' | tee /tmp/obf-files.txt
          while read f; do cp "$f" /tmp/out/ollvm/lib/ || true; done < /tmp/obf-files.txt
          # include clang resource dir
          if [ -d /tmp/build/lib/clang ]; then mkdir -p /tmp/out/ollvm/lib && cp -a /tmp/build/lib/clang /tmp/out/ollvm/lib/; fi
          (cd /tmp/out && tar -czf /tmp/ollvm.tar.gz ollvm)
          ls -lh /tmp/ollvm.tar.gz
          tar -tzf /tmp/ollvm.tar.gz | head -40

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ollvm16-linux-x86_64
          path: /tmp/ollvm.tar.gz
